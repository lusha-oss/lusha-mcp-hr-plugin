name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies, so no install step. `check` regenerates nothing: it compares the
      # committed manifests against plugin.config.json and fails if they drift, which is
      # the whole reason the manifests are generated.
      - run: npm run check
